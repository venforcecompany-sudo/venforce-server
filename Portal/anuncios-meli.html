<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anúncios ML — VenForce</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Esta página declarava as fontes da Fundação V2 (via tokens) sem nunca
       carregá-las — era a única do lote V3 sem este <link>, e por isso
       renderizava na fonte de fallback do sistema. Mesma linha de ads.html,
       clientes.html e carteira.html. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="css/vf-tokens-v2.css" />
  <link rel="stylesheet" href="css/vf-components-v2.css" />
  <link rel="stylesheet" href="css/pages/anuncios-meli-v2.css?v=20261029-1" />
  <link rel="stylesheet" href="css/vf-shell.css">
</head>
<body class="vf-page vf-page-anuncios-meli" data-vf-scope="account" data-vf-module="anuncios">
  <!-- F5 — .vf-main-with-sidebar era a margem fixa de 240px do layout.js.
       O Shell V3 tem grade própria (.vf-shell). Wrapper neutro. -->
  <div>
    <main class="vf-content" id="am-conteudo">
      <div class="vf-page-shell">
        <div class="vf-page-container vf-page-container--wide" id="am-page">
          <header class="vf-page-header">
            <div class="vf-page-header__main">
              <p class="vf-page-header__eyebrow">Mercado Livre</p>
              <h1 class="vf-page-header__title">Anúncios ML</h1>
              <p class="vf-page-header__description">Consulte, sincronize, revise e otimize os anúncios Mercado Livre de cada cliente.</p>
            </div>
          </header>

          <!-- F5 — a VIEW de "Escolha um cliente" saiu: quem escolhe Cliente
               e Operação é o Shell V3 (data-vf-scope="account"). A tela tinha
               um grid de clientes E um seletor de conta Mercado Livre, com uma
               cópia própria da regra de cardinalidade — a regra mora só em
               vf-context.js (R8). -->
          <section class="vf-section" id="am-view-hud" aria-labelledby="am-cliente-contexto-titulo">

            <div class="am-hud-top" id="am-hud-top" aria-live="polite"></div>
            <div class="vf-metric-row am-resumo" id="am-resumo" aria-label="Resumo dos anúncios"></div>

            <section class="vf-section am-catalogo-section" aria-labelledby="am-catalogo-titulo">
              <div class="vf-section__header">
                <div>
                  <h2 class="vf-section__title" id="am-catalogo-titulo">Catálogo de anúncios</h2>
                  <p class="vf-section__description">Busque por título, MLB ou SKU. Clique num indicador acima para filtrar por status ou qualidade.</p>
                </div>
              </div>

              <div class="vf-toolbar am-filtros">
                <div class="vf-toolbar__filters">
                  <div class="vf-field am-filtro-busca">
                    <label class="vf-field__label" for="am-busca">Buscar anúncios</label>
                    <input type="search" id="am-busca" class="vf-input vf-search"
                           placeholder="Título, MLB ou SKU" autocomplete="off" />
                  </div>
                  <div class="vf-field am-filtro-ordenacao">
                    <label class="vf-field__label" id="am-ordenacao-label">Ordenar por</label>
                    <!-- Fonte da verdade continua sendo este <select> — só oculto
                         visualmente. O combo abaixo só o pilota (seta .value e
                         dispara "change"); aplicarOrdenacaoPerformance nem sabe
                         que a UI mudou. Ver anuncios-meli.js (bindEventosFixos /
                         sincronizarComboOrdenacao). -->
                    <select id="am-ordenacao" class="vf-select" aria-hidden="true" hidden>
                      <option value="">Padrão</option>
                      <option value="margem_asc">Margem: menor → maior</option>
                      <option value="margem_desc">Margem: maior → menor</option>
                      <option value="faturamento_asc">% Faturamento: menor → maior</option>
                      <option value="faturamento_desc">% Faturamento: maior → menor</option>
                      <option value="unidades_asc">Unidades vendidas 7d: menor → maior</option>
                      <option value="unidades_desc">Unidades vendidas 7d: maior → menor</option>
                      <option value="curvaAbc_asc">Curva ABC: A → C</option>
                      <option value="curvaAbc_desc">Curva ABC: C → A</option>
                    </select>
                    <div class="am-ordenacao-combo vf-input-group" id="am-ordenacao-combo">
                      <button type="button" class="vf-input am-ordenacao-trigger" id="am-ordenacao-trigger"
                              aria-haspopup="listbox" aria-expanded="false" aria-labelledby="am-ordenacao-label">
                        <span id="am-ordenacao-trigger-label">Padrão</span>
                        <svg class="am-ordenacao-trigger__chev" width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                          <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                      </button>
                      <button type="button" class="vf-input-suffix am-ordenacao-dir" id="am-ordenacao-dir" disabled aria-label="—">
                        <svg class="am-ordenacao-dir__icone" width="10" height="13" viewBox="0 0 10 13" fill="none" aria-hidden="true">
                          <path class="am-ordenacao-dir__seta am-ordenacao-dir__seta--asc" d="M5 0L9.33 5H0.67L5 0Z" />
                          <path class="am-ordenacao-dir__seta am-ordenacao-dir__seta--desc" d="M5 13L0.67 8H9.33L5 13Z" />
                        </svg>
                      </button>
                      <div class="am-ordenacao-menu vf-menu" id="am-ordenacao-menu" role="listbox" aria-label="Ordenar por" hidden></div>
                    </div>
                  </div>
                </div>
                <div class="vf-toolbar__actions">
                  <span class="vf-tag is-primary am-hidden" id="am-filtros-ativos">Filtros ativos</span>
                  <!-- Ações de custo fora do modo de edição: split "Editar custos"
                       + menu "Importar base de custo", na mesma linha da busca e
                       antes do Radar. O aviso sem Base e a faixa do modo ficam em
                       #am-custos-barra. -->
                  <div id="am-custos-acoes-slot" class="am-custos-acoes-slot">
                    <!-- Visível mesmo antes de baixar/executar o JS; a Base habilita a edição. -->
                    <div class="am-custos-acoes">
                      <div class="am-custos-split">
                        <button type="button" class="am-custos-split__main" data-custos-acao="entrar" disabled>
                          <span class="am-custos-split__ico" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                          </span>
                          <span class="am-custos-split__txt"><span class="am-custos-split__titulo">Editar custos</span><span class="am-custos-split__sub">Custo do produto na Base</span></span>
                        </button>
                        <button type="button" class="am-custos-split__seta" data-custos-acao="menu" aria-label="Mais opções de custo" disabled aria-haspopup="menu" aria-expanded="false" aria-controls="am-custos-menu">
                          <svg width="14" height="14" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
                        </button>
                      </div>
                      <div class="am-custos-menu vf-menu" id="am-custos-menu" role="menu" hidden></div>
                    </div>
                  </div>
                  <!-- Radar de subsídios (Promoções com rebate): só com cliente+conta
                       e fora do modo "Editar custos". Ocupa a altura inteira da
                       barra. Ver anuncios-meli.js, "PROMOÇÕES COM REBATE". -->
                  <button type="button" class="am-reb-abrir" id="am-reb-abrir" disabled
                          title="Escolha um cliente e uma conta para analisar">
                    <span class="am-reb-abrir__ico" aria-hidden="true">
                      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M2.5 10.2V3.5a1 1 0 0 1 1-1h6.7a1 1 0 0 1 .7.3l6.6 6.6a1 1 0 0 1 0 1.4l-6.7 6.7a1 1 0 0 1-1.4 0l-6.6-6.6a1 1 0 0 1-.3-.7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" /><circle cx="6.5" cy="6.5" r="1.3" fill="currentColor" /><path d="M8.5 13.5l4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
                    </span>
                    <span class="am-reb-abrir__txt">
                      <span class="am-reb-abrir__titulo">Radar de subsídios</span>
                      <span class="am-reb-abrir__sub">Promoções com rebate do ML</span>
                    </span>
                    <svg class="am-reb-abrir__seta" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
                  </button>
                  <!-- Transferir promoção: move anúncios de uma promoção para outra
                       (virada de mês). Mesmo formato do Radar, na cor de informação.
                       Ver anuncios-meli.js, "TRANSFERIR PROMOÇÃO". -->
                  <button type="button" class="am-reb-abrir am-transf-abrir" id="am-transf-abrir" disabled
                          title="Escolha um cliente e uma conta para transferir">
                    <span class="am-reb-abrir__ico" aria-hidden="true">
                      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 6.5h12M12 3.5l3 3-3 3M17 13.5H5M8 10.5l-3 3 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    </span>
                    <span class="am-reb-abrir__txt">
                      <span class="am-reb-abrir__titulo">Transferir promoção</span>
                    </span>
                    <svg class="am-reb-abrir__seta" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
                  </button>
                </div>
              </div>
              <div id="am-ordenacao-aviso" class="vf-alert is-warning" role="status" hidden></div>
              <!-- Custo do produto na lista: "Editar custos" (modo massa) ou o
                   aviso de Base não vinculada. A edição pontual mora na própria
                   célula Margem. Ver anuncios-meli.js, "CUSTO DO PRODUTO NA LISTA". -->
              <div id="am-custos-barra" class="am-custos-barra"></div>

              <!-- UMA lista. Havia aqui um seletor de modo ("Famílias" /
                   "Sem agrupamento") e dois containers irmãos alternados por
                   [hidden] — duas listagens, duas paginações, e o operador
                   nunca via o catálogo inteiro. A família é forma de
                   agrupamento interno do Mercado Livre, não categoria de
                   tela: agora agrupador e anúncio individual são linhas da
                   mesma lista. Ver
                   docs/AUDITORIA_ANUNCIOS_ML_LISTAGEM_UNIFICADA.md. -->
              <div id="am-catalogo-container" aria-live="polite"></div>
            </section>
          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- Barra de salvar do modo "Editar custos" (fixa no rodapé). -->
  <div class="am-custos-savebar" id="am-custos-savebar" aria-live="polite"></div>
  <div class="vf-toast-stack" id="am-toast-stack" role="status" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="vf-shell.js"></script>
  <script src="anuncios-meli.js?v=20261112-1"></script>
</body>
</html>
