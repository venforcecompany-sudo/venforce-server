<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anúncios ML — VenForce</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="css/vf-tokens-v2.css" />
  <link rel="stylesheet" href="css/vf-components-v2.css" />
  <link rel="stylesheet" href="css/pages/anuncios-meli-v2.css" />
  <link rel="stylesheet" href="css/vf-shell.css">
</head>
<body class="vf-page vf-page-anuncios-meli" data-vf-scope="account" data-vf-module="anuncios">
  <!-- F5 — .vf-main-with-sidebar era a margem fixa de 240px do layout.js.
       O Shell V3 tem grade própria (.vf-shell). Wrapper neutro. -->
  <div>
    <main class="vf-content" id="am-conteudo">
      <div class="vf-page-shell">
        <div class="vf-page-container vf-page-container--wide" id="am-page">
          <header class="vf-page-header">
            <div class="vf-page-header__main">
              <p class="vf-page-header__eyebrow">Mercado Livre</p>
              <h1 class="vf-page-header__title">Anúncios ML</h1>
              <p class="vf-page-header__description">Consulte, sincronize, revise e otimize os anúncios Mercado Livre de cada cliente.</p>
            </div>
          </header>

          <!-- F5 — a VIEW de "Escolha um cliente" saiu: quem escolhe Cliente
               e Operação é o Shell V3 (data-vf-scope="account"). A tela tinha
               um grid de clientes E um seletor de conta Mercado Livre, com uma
               cópia própria da regra de cardinalidade — a regra mora só em
               vf-context.js (R8). -->
          <section class="vf-section" id="am-view-hud" aria-labelledby="am-cliente-contexto-titulo">

            <div class="am-hud-top" id="am-hud-top" aria-live="polite"></div>
            <div class="vf-kpi-grid am-resumo" id="am-resumo" aria-label="Resumo dos anúncios"></div>

            <section class="vf-section am-catalogo-section" aria-labelledby="am-catalogo-titulo">
              <div class="vf-section__header">
                <div>
                  <h2 class="vf-section__title" id="am-catalogo-titulo">Catálogo de anúncios</h2>
                  <p class="vf-section__description">Busque por título, MLB ou SKU. Clique num indicador acima para filtrar por status ou qualidade.</p>
                </div>
              </div>

              <div class="vf-toolbar am-filtros">
                <div class="vf-toolbar__filters">
                  <div class="vf-field am-filtro-busca">
                    <label class="vf-field__label" for="am-busca">Buscar anúncios</label>
                    <input type="search" id="am-busca" class="vf-input vf-search"
                           placeholder="Título, MLB ou SKU" autocomplete="off" />
                  </div>
                </div>
                <div class="vf-toolbar__actions">
                  <span class="vf-tag is-primary am-hidden" id="am-filtros-ativos">Filtros ativos</span>
                </div>
              </div>

              <div id="am-catalogo-container" aria-live="polite"></div>
            </section>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div class="vf-toast-stack" id="am-toast-stack" role="status" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="vf-shell.js"></script>
  <script src="anuncios-meli.js"></script>
</body>
</html>
