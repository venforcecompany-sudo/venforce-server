<!-- data-vf-scope="global": mesma classe de Carteira/Clientes e Contas —
     esta tela é a própria carteira agrupada por Squad, nunca precisa de
     Cliente+Operação escolhidos antes de renderizar (Shell mostra `main`
     assim que sai de BOOT/PORTFOLIO_ERROR, ver vf-shell.js aplicarGating). -->
<body class="vf-page vf-page-painel-contas" data-vf-scope="global" data-vf-module="painel-contas">
  <div id="root"></div>

  <!-- Shell V3: sidebar, contexto operacional, gating por escopo. Script
       módulo, executa ANTES do bundle React abaixo. Constrói `.vf-shell` em
       volta do #root acima (Portal/vf-shell.js: buildShellDom()). -->
  <script type="module" src="./vf-shell.js"></script>
</body>
