<!-- F3.2 — primeira ilha React sobre o Shell V3: data-vf-scope="account"
     (a Visão nasce de Cliente+Operação escolhidos, nunca renderiza sem
     conta resolvida — MASTER_SPEC §11.1/§16). O Shell decide sozinho quando
     mostrar `.vf-shell__main` (onde o #root do React vive); o React não
     reimplementa esse gating, só assume READY quando está visível. -->
<body class="vf-page vf-page-visao" data-vf-scope="account" data-vf-module="visao">
  <div id="root"></div>

  <!-- Shell V3: sidebar, contexto operacional, gating por escopo. Script
       módulo, executa ANTES do bundle React abaixo (ordem de document, os
       dois são deferred — MASTER_SPEC §6.5/§15.3). Constrói `.vf-shell` em
       volta do #root acima (Portal/vf-shell.js: buildShellDom()). -->
  <script type="module" src="./vf-shell.js"></script>
</body>
</html>
